name: First workflow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: echo "Hello from GitHub Actions"

      - name: Show runner information
        run: |
          echo "Operating system: $RUNNER_OS"
          echo "Workspace: $GITHUB_WORKSPACE"
