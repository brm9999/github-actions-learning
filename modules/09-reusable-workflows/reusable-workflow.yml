name: Reusable TaskFlow CI

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '20'
      XYZ:
        required: false
        type: string
        default: '123'
  pull_request:
  workflow_dispatch:


permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - run: npm ci
      - run: npm test
